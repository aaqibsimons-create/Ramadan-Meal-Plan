<style>
:root{--bg:#fff;--sf:#fff;--ink:#111;--mu:#5f5f5f;--ln:#e3e3e3;--au:#d8121b;--sel:#f4f4f4;--ac:#d8121b;--acx:#fff;--pg:#ececec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}

:root[data-theme="dark"]{--bg:#0e0e0e;--sf:#161616;--ink:#f2f2f2;--mu:#aaa;--ln:#333;--sel:#1d1d1d;--ac:#ff4a52;--au:#ff4a52;--acx:#111;--pg:#000;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 'Barlow',system-ui,sans-serif;background:var(--pg);color:var(--ink);display:grid;place-items:center;min-height:100vh;padding:16px}
h1,h2,h3{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;line-height:1.1;margin:0 0 .4em}
h1{font-size:2rem}h2{font-size:1.4rem;padding-left:8px;border-left:4px solid var(--au);margin-top:6px}h3{font-size:1.05rem}
.ad{width:300px;height:600px;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg);border:1px solid var(--ln)}
.hd{background:#fff;color:#111;display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:2px solid #111;flex:none}
.logo{height:34px;width:auto;display:block}.hd b{font:700 1.05rem/1.1 'Barlow Condensed',sans-serif;display:block}.hd span{font-size:.7rem;color:#5f5f5f;display:block}.hd i{font-style:normal;font-weight:600;color:#111;border-bottom:1px solid #111}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px}
.tabs{display:flex;flex:none;border-top:1px solid var(--ln);background:var(--bg)}
.tabs button{flex:1;min-height:46px;border:0;border-top:3px solid transparent;background:none;color:var(--mu);font:600 13px 'Barlow',sans-serif;cursor:pointer}.tabs button[aria-current=true]{color:var(--ink);border-top-color:var(--au)}
:focus-visible{outline:3px solid var(--ink);outline-offset:1px}
.b{min-height:44px;padding:0 14px;border-radius:2px;border:1.5px solid var(--ac);background:var(--ac);color:var(--acx);font:600 14px 'Barlow',sans-serif;cursor:pointer}
.b.o{background:transparent;color:var(--ink);border-color:var(--ink)}.b.w{width:100%}
.l{color:var(--mu);margin:0 0 6px}.note{font-size:.78rem;color:var(--mu);margin:4px 0}
fieldset{border:0;padding:0;margin:0 0 12px}legend{font-weight:600;margin-bottom:5px;padding:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}.opt{position:relative;display:block}.opt input{position:absolute;opacity:0;inset:0}
.opt span{display:flex;align-items:center;height:100%;padding:6px 8px;min-height:44px;border:1px solid var(--ln);border-radius:2px;background:var(--sf);cursor:pointer;font-size:.85rem;line-height:1.2}
.opt input:checked+span{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:600}.opt input:checked+span::before{content:"✓ ";color:var(--au);margin-right:3px}.opt input:focus-visible+span{outline:3px solid var(--ink);outline-offset:1px}
.day{border-top:1px solid var(--ln);padding:10px 0;display:grid;grid-template-columns:44px 1fr;gap:4px 10px}
.ph{width:44px;height:44px;background:var(--sel);display:grid;place-items:center;font-size:1.5rem}.dn{font-weight:600;color:var(--au);font-size:.8rem}.day h3{margin:0}
.meta{color:var(--mu);font-size:.8rem}.chip{background:var(--sel);padding:0 6px;margin-right:5px}
.act{grid-column:1/-1;display:flex;gap:6px}.act .b{flex:1;min-height:40px}
.spon{background:var(--sel);border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);padding:8px 10px;margin:8px 0;font-size:.8rem;color:var(--mu)}.spon b{color:var(--ink)}
.cat h3{border-bottom:2px solid var(--ink);margin-top:12px}.it{display:flex;gap:10px;align-items:center;min-height:44px;border-bottom:1px solid var(--ln)}
.it input{width:22px;height:22px;accent-color:var(--au);flex:none}.it label{flex:1;display:flex;justify-content:space-between;gap:8px;cursor:pointer}.it input:checked+label{text-decoration:line-through;color:var(--mu)}.q{font-weight:600;white-space:nowrap}
progress{width:100%;height:8px;accent-color:var(--au)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.empty{border:1px dashed var(--ln);padding:18px;text-align:center;color:var(--mu);margin-bottom:10px}
ul{padding-left:18px;margin:4px 0}.lnk{display:block;border-top:1px solid var(--ln);padding:10px 0;font-weight:600;text-decoration:none;color:var(--ink);min-height:44px}.lnk:hover{color:var(--au)}
details{border-top:1px solid var(--ln);padding:8px 0;margin-top:8px}code{font-size:.75rem}
#ov{position:absolute;inset:0;background:var(--bg);overflow-y:auto;padding:12px;z-index:5}#ov[hidden]{display:none}#ov h2{margin-top:10px}
#toast{position:absolute;left:12px;right:12px;bottom:56px;background:#111;color:#fff;padding:10px 12px;border-radius:2px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;font-size:.85rem}#toast.on{opacity:1}
.cap{font-size:.75rem;color:var(--mu);margin:8px 0 0;text-align:center;max-width:300px}
@media print{body{display:block;padding:0}.hd,.tabs,.cap,.noprint{display:none!important}.ad{width:auto;height:auto;border:0;overflow:visible}main{overflow:visible}}
</style>

salad:{n:'Grilled chicken and potato salad',c:'Lighter option',t:35,e:'🥗',tg:'L',i:'chk:.6,let:1,tom:.3,cuc:1,lem:1,pot:.4,oil:1,salt:1',s:'Boil the potatoes until tender, then halve them.|Grill the seasoned chicken and slice it.|Toss with lettuce, tomato, cucumber, lemon juice and oil.'},
lsoup:{n:'Lentil and vegetable soup',c:'Lighter option',t:45,e:'🥣',tg:'L',i:'lent:.3,car:.3,oni:.3,pot:.3,tom:.2,roll:4,stock:1,spice:1',s:'Fry the onion and spices, then add chopped vegetables, lentils and stock.|Simmer for 30 minutes until the lentils are soft.|Serve with warm rolls.'},
butternut:{n:'Butternut soup and bread rolls',c:'Budget-friendly',t:40,e:'🎃',tg:'L',i:'but:1,oni:.3,pot:.3,roll:4,stock:1,oil:1,salt:1',s:'Fry the onion, add cubed butternut and potato with stock.|Simmer until soft, then blend until smooth.|Season and serve with rolls.'}};
const PL={mix:['roast','curry','dhal','wraps','fish','breyani','burgers'],trad:['roast','curry','dhal','stew','fish','breyani','burgers'],quick:['wraps','bolo','chickpea','burgers','friedrice','chwraps','dhal'],light:['salad','lsoup','fish','butternut','dhal','chickpea','chwraps']};
const SU=['Oats with banana','Scrambled eggs on toast','Yoghurt with fruit','Overnight oats','Cheese and tomato toast','Fruit smoothie','Omelette with bread'];
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const G=[['hh','Household size',[['1','1 person'],['2','2 people'],['3','3 to 4 people'],['5','5 to 6 people'],['7','7 or more people']]],
['bd','Budget preference',[['low','Budget-conscious'],['bal','Balanced and affordable'],['flex','Flexible']]],
['mp','Meal preference',[['trad','Traditional favourites'],['quick','Quick and easy meals'],['light','Fresh and lighter meals'],['mix','A mixture of everything']]],
['pr','Planning priority',[['suhoor','Suhoor'],['iftar','Iftar'],['both','Both Suhoor and Iftar']]]];
// ---------- State ----------
const S={hh:'3',bd:'bal',mp:'mix',pr:'iftar',plan:[],ck:new Set(),view:'compact'};
const $=s=>document.querySelector(s);
const track=n=>console.debug('[IOL planner event]',n);
const SV=()=>({1:1,2:2,3:4,5:6,7:8})[S.hh];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2600)}
function fmt(k,q){const[,c,u]=I[k];if(c==='P')return'Check pantry';if(u==='kg'){q=Math.ceil(q*20-1e-9)/20;return q<1?Math.round(q*1000)+' g':(+q.toFixed(2))+' kg'}q=Math.ceil(q-1e-9);return q+(u?' '+u:'')}
const ings=id=>R[id].i.split(',').map(x=>{const[k,q]=x.split(':');return[k,+q*SV()/4]});
function totals(){const m={};S.plan.forEach(id=>ings(id).forEach(([k,q])=>m[k]=(m[k]||0)+q));return m}

// ---------- Views ----------
S.tab='setup';
const v=$('#v'),ov=$('#ov');
const TABS=[['setup','Setup'],['plan','Plan'],['list','List'],['tips','Tips']];
$('.tabs').innerHTML=TABS.map(([k,l])=>`<button data-a="tab" data-t="${k}">${l}</button>`).join('');
const empty=t=>`<h2>${t==='plan'?'Your Iftar week':'Shopping list'}</h2><div class="empty">${t==='plan'?'No plan yet.':'Your list appears here once you generate a plan.'}</div><button class="b w" data-a="tab" data-t="setup">Go to preferences</button>`;
const spon=t=>`<div class="spon"><b>Sponsored · [Retail Partner]</b><br>${t}</div>`;
function setup(){return `<h1>The Ramadan Meal Planner</h1><p class="l">Take the stress out of Iftar. Plan a week’s worth of meals, organise your shopping list and make more of Ramadan.</p><p class="note">Free to use. No account required.</p><form id="f" style="margin-top:12px">${G.map(([k,l,o])=>`<fieldset><legend>${l}</legend><div class="opts">${o.map(([x,t])=>`<label class="opt"><input type="radio" name="${k}" value="${x}" ${S[k]===x?'checked':''}><span>${t}</span></label>`).join('')}</div></fieldset>`).join('')}</form><button class="b w" data-a="gen">Generate my meal plan</button><p id="stat" class="note" role="status" aria-live="polite"></p>`}
function build(){let p=[...PL[S.mp]];if(S.bd==='low'){if(!p.includes('chickpea'))p[1]='chickpea';if(!p.includes('butternut'))p[4]='butternut'}return p}
function plan(){if(!S.plan.length)return empty('plan');
const su=S.pr!=='iftar'?spon('<b>Suhoor ideas:</b> '+SU.join(', ')+'. Illustrative only; not in the shopping list.'):'';
return `<h2>Your Iftar week</h2><p class="note">Serves ${SV()}.${S.bd==='low'?' Includes extra meat-free meals.':''} Illustrative recipes.</p>${su}`+S.plan.map((id,i)=>{const r=R[id];return `<article class="day"><div class="ph" role="img" aria-label="Image placeholder">${r.e}</div><div><div class="dn">${DAYS[i]}</div><h3>${r.n}</h3><div class="meta"><span class="chip">${r.c}</span>${r.t} min</div></div><div class="act"><button class="b o" data-a="rec" data-i="${i}">View recipe</button><button class="b o" data-a="swap" data-i="${i}">Swap meal</button></div></article>`+(i===3?spon('Recipe idea placeholder. No prices or stock shown.'):'')}).join('')}
function list(){if(!S.plan.length)return empty('list');const t=totals(),keys=Object.keys(t);
return `<h2>Shopping list</h2><p class="note">Summed from your seven recipes for ${SV()} servings and rounded up. Illustrative: check your pantry.</p><progress id="pg" max="1" value="0" aria-label="Shopping progress"></progress><p id="pgt" class="meta"></p><div class="g2"><button class="b" data-a="cp">Copy remaining</button><button class="b o" data-a="pr">Print list</button><button class="b o" data-a="rs">Reset</button><button class="b o" data-a="shop">Shop these ingredients</button></div><div id="lst">${Object.keys(CATS).map(c=>{const ks=keys.filter(k=>I[k][1]===c);return ks.length?`<div class="cat"><h3>${CATS[c]}</h3>${ks.map(k=>`<div class="it"><input type="checkbox" id="c_${k}" data-k="${k}" ${S.ck.has(k)?'checked':''}><label for="c_${k}"><span>${I[k][0]}</span><span class="q">${fmt(k,t[k])}</span></label></div>`).join('')}</div>`:''}).join('')}</div>${spon('Shopping offer placeholder. Prefer another store? Copy or print your list.')}`}
function tips(){return `<h2>Budget guide</h2><ul><li>Reuse ingredients across meals.</li><li>Include affordable meat-free meals.</li><li>Use the swap button for substitutions.</li><li>Check your pantry before shopping.</li><li>Plan only what you will cook to cut waste.</li></ul><p class="note"><b>Estimated basket cost:</b> Retailer pricing integration available in a future phase.</p><h2>More from IOL</h2><p class="note">Placeholder links. Editorial to supply destinations.</p>${['Suhoor made simple','Budget-friendly Ramadan meals','Make-ahead recipes','Iftar for the family','Eid preparation'].map(x=>`<a class="lnk" href="#" data-ph>${x}</a>`).join('')}<details><summary><b>Notes for IOL developers</b></summary><p class="note">Production events (no personal data; follow IOL consent rules). This prototype only logs to the console.</p><ul><li><code>planner_started</code>: clicked Generate flow start</li><li><code>preferences_submitted</code>: form submitted</li><li><code>meal_plan_generated</code>: plan shown</li><li><code>recipe_opened</code>: recipe viewed</li><li><code>meal_swapped</code>: meal replaced</li><li><code>shopping_list_created</code>: list built</li><li><code>shopping_list_copied</code>, <code>shopping_list_printed</code></li><li><code>retailer_cta_clicked</code>: sponsor CTA</li></ul><p class="note">To go live: validated recipes, real photography, sponsor creative and URL, pricing feed, analytics, disclosure copy. Not implemented: live pricing, stock, accounts, saved plans, Suhoor shopping list.</p></details>`}
function render(keep){const st=v.scrollTop;v.innerHTML={setup,plan,list,tips}[S.tab]();document.querySelectorAll('.tabs button').forEach(b=>b.toggleAttribute('aria-current',b.dataset.t===S.tab)||0);document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.t===S.tab));v.scrollTop=keep?st:0;if(S.tab==='list')prog()}
function prog(){const t=totals(),n=S.plan.length?Object.keys(t).length:0,d=[...S.ck].filter(k=>t[k]!==undefined).length,p=$('#pg');if(!p)return;p.value=n?d/n:0;$('#pgt').textContent=`${d} of ${n} items ticked`}
function remaining(){const t=totals();return Object.keys(CATS).map(c=>{const l=Object.keys(t).filter(k=>I[k][1]===c&&!S.ck.has(k));return l.length?CATS[c]+'\n'+l.map(k=>`- ${I[k][0]}: ${fmt(k,t[k])}`).join('\n'):''}).filter(Boolean).join('\n\n')}
// ---------- Overlay ----------
const back='<button class="b s o" data-a="close">← Back</button>';
function open(h){ov.innerHTML=back+h;ov.hidden=false;ov.scrollTop=0;ov.querySelector('button').focus()}
function close(){ov.hidden=true}
function recipe(i){const id=S.plan[i],r=R[id];track('recipe_opened');open(`<h2>${r.n}</h2><p class="meta"><span class="chip">${r.c}</span>${r.t} min · Serves ${SV()}</p><p class="note">Illustrative recipe. Quantities not professionally validated.</p><h3>Ingredients</h3><ul>${ings(id).map(([k,q])=>`<li>${I[k][0]}: ${fmt(k,q)}</li>`).join('')}</ul><h3>Method</h3><ol style="padding-left:18px">${r.s.split('|').map(s=>`<li>${s}</li>`).join('')}</ol><div class="g2"><button class="b" data-a="close">Back to weekly menu</button><button class="b o" data-a="swap" data-i="${i}">Swap meal</button></div>`)}
function swap(i){const tg={trad:'T',quick:'Q',light:'L'}[S.mp];let c=Object.keys(R).filter(k=>!S.plan.includes(k)&&(!tg||R[k].tg.includes(tg)));if(c.length<2)c=c.concat(Object.keys(R).filter(k=>!S.plan.includes(k)&&!c.includes(k)));c=c.slice(0,3);
open(`<h2>Swap ${DAYS[i]}’s meal</h2><p class="meta">Replacing ${R[S.plan[i]].n}. Pick one:</p>${c.map(k=>`<button class="b o w" style="text-align:left;margin:6px 0;height:auto;padding:8px 12px" data-a="pick" data-i="${i}" data-id="${k}">${R[k].e} <b>${R[k].n}</b><br><span class="meta">${R[k].c} · ${R[k].t} min</span></button>`).join('')}`)}
// ---------- Actions ----------
document.addEventListener('click',e=>{
const ph=e.target.closest('[data-ph]');if(ph){e.preventDefault();toast('Placeholder link. Real destination to be supplied.');return}
const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,i=+el.dataset.i;
if(a==='tab'){S.tab=el.dataset.t;if(S.tab==='setup')track('planner_started');render()}
else if(a==='gen'){track('preferences_submitted');$('#stat').textContent='Building your plan…';setTimeout(()=>{S.plan=build();S.ck=new Set();S.tab='plan';render();track('meal_plan_generated');track('shopping_list_created');toast('Meal plan generated. Your shopping list is ready.')},500)}
else if(a==='rec')recipe(i);else if(a==='swap')swap(i);
else if(a==='pick'){S.plan[i]=el.dataset.id;track('meal_swapped');close();render(true);toast(`${DAYS[i]} is now ${R[el.dataset.id].n}. List updated.`)}
else if(a==='close')close();
else if(a==='cp'){const t=remaining();if(!t){toast('Nothing left to copy. Everything is ticked.');return}track('shopping_list_copied');const done=()=>toast('Remaining list copied');if(navigator.clipboard)navigator.clipboard.writeText(t).then(done,()=>fb(t,done));else fb(t,done)}
else if(a==='pr'){track('shopping_list_printed');try{window.print()}catch(x){toast('Printing unavailable here. Use Copy instead.')}}
else if(a==='rs'){S.ck=new Set();render(true);toast('Checklist reset')}
else if(a==='shop'){track('retailer_cta_clicked');open(`<h2>Shop these ingredients</h2><p><b>Demonstration screen.</b> In production this sends your list to [Retail Partner]’s online store via a destination agreed with the sponsor.</p><p class="note">No retailer, prices, stock or URLs are connected. Your list works anywhere you shop.</p>`)}});
function fb(t,done){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');done()}catch(e){toast('Copy failed. Select the list manually.')}x.remove()}
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.k){t.checked?S.ck.add(t.dataset.k):S.ck.delete(t.dataset.k);prog()}else if(t.type==='radio'){S[t.name]=t.value;if(S.plan.length)toast('Quantities updated. Generate again to change the menu.')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!ov.hidden)close()});
render();
</script>
</body>
</html>
